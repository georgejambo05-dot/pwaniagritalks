<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | PWANIAGRITALKS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=12">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='pwaniagritalks-brand-logo.png') }}?v=3">
</head>
<body>
    <header><h1 class="site-logo-heading"><a href="{{ url_for('home') }}" aria-label="PWANIAGRITALKS home"><img class="site-logo" src="{{ url_for('static', filename='pwaniagritalks-brand-logo.jpg') }}?v=3" alt="PWANIAGRITALKS — Growing the Coast Through Agriculture"></a></h1><p>Change your password</p></header>
    <nav><a href="{{ url_for('farmer_portal') }}">Back to my account</a></nav>
    <main>
        <section>
            <h2>Change Password</h2>
            <p>Enter your current password, then choose a new password with at least 5 characters.</p>
            {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
            <form method="post">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <label for="current_password">Current password</label>
                <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" minlength="5" autocomplete="new-password" required>
                <label for="confirmation">Type the new password again</label>
                <input type="password" id="confirmation" name="confirmation" minlength="5" autocomplete="new-password" required>
                <button type="submit">Save New Password</button>
            </form>
        </section>
    </main>
    <footer><p>PWANIAGRITALKS | Growing the Coast Through Agriculture</p></footer>
</body>
</html>
